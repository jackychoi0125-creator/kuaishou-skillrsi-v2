[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skillrsi-m1"
version = "0.1.0"
description = "Evidence-grounded reliability filtering and failure localization for Trace2Skill"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
skillrsi-m1 = "skillrsi_m1.cli:main"
skillrsi-m2 = "skillrsi_m1.m2:main"
skillrsi-loop = "skillrsi_loop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

